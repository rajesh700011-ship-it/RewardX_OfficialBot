<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RewardX Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{font:15px system-ui;background:#eef1ff;margin:0;padding:16px;color:#0f1b3d}.c{background:#fff;border-radius:16px;padding:14px;margin:10px 0}h2{margin:22px 0 6px}
input,textarea{width:100%;padding:11px;border:1px solid #d5dbf5;border-radius:12px;margin:4px 0 10px;font:inherit;box-sizing:border-box}label{font-size:12px;color:#667391}
button{background:#4a5cff;color:#fff;border:0;border-radius:12px;padding:10px 14px;font:600 14px system-ui;margin:4px 4px 0 0}.bad{color:#d93b3b;font-weight:700}<style>.menu{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}.menu-btn{width:100%;padding:18px;text-align:left;font-size:16px}.section{display:none}.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.top h2{flex:1}.top button{background:#6b7280}.box{background:#fff;border-radius:16px;padding:14px;margin:10px 0}.item{background:#f5f6ff;border:1px solid #e1e5f8;border-radius:12px;padding:12px;margin:9px 0}.danger{background:#d93b3b}h3{margin-top:4px}</style></style></head>
<body><div id="m"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyADtZteQS9_nOptDaf-bTxJGD6PjdmJ1H4",
  authDomain: "reward-f9e07.firebaseapp.com",
  databaseURL: "https://reward-f9e07-default-rtdb.firebaseio.com", /* check this in Firebase Console > Realtime Database */
  projectId: "reward-f9e07",
  storageBucket: "reward-f9e07.firebasestorage.app",
  messagingSenderId: "1006382243983",
  appId: "1:1006382243983:web:09c5f99330106bd688d0fa",
  measurementId: "G-RT23SMMJLN"
};
firebase.initializeApp(firebaseConfig);
const R=p=>firebase.database().ref(p),G=async p=>(await R(p).once("value")).val(),N=v=>Number(v)||0;
const e=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let USERS=[],cur="home",shown=50;
const DEF={ad_reward:1,daily_ad_limit:20,ads_enabled:1,ad_zone:"",ad_sdk_url:"",ref_reward:5,ref_enabled:1,required_referrals:3,min_withdrawal:100,max_withdrawal:5000,withdrawal_fee:0,welcome_bonus:20,welcome_enabled:1,daily_bonus:2,daily_enabled:0,method_bkash:1,method_nagad:1,method_rocket:1,popup_enabled:1,popup_title:"",popup_body:"",popup_btn:"বুঝেছি",popup_link:""};
const TXT=["ad_zone","ad_sdk_url","popup_title","popup_body","popup_btn","popup_link"],K=Object.keys(DEF);
function login(){load()}
async function load(){
  try{
    const [S0,T0,Wq]=await Promise.all([G("settings/pub"),G("tasks/pub"),R("withdrawals").limitToLast(100).once("value")]);
    const S={...DEF,...(S0||{})},T=Object.entries(T0||{}).reverse(),all=Object.entries(Wq.val()||{}).reverse();
    const st=await Promise.all(all.map(([id])=>G("wdStatus/"+id+"/pub"))),W=all.filter((x,i)=>st[i]==="pending");
    const B=await Promise.all(W.map(async([id,w])=>{const L=Object.values(await G("users/"+w.uid+"/ledger")||{}).reduce((a,x)=>a+N(x.amount),0),U=await G("userWd/"+w.uid)||{};let r=0;for(const k of Object.keys(U))if(await G("wdStatus/"+k+"/pub")==="rejected")r+=N(U[k].amount);return L+r}));
    m.innerHTML=`
      <div id="home"><h2>👑 RewardX Admin</h2><div class="menu">
        <button class="menu-btn" onclick="showSec('users')">👥 Users</button>
        <button class="menu-btn" onclick="showSec('withdrawals')">💸 Withdrawals</button>
        <button class="menu-btn" onclick="showSec('tasks')">📋 Tasks</button>
        <button class="menu-btn" onclick="showSec('settings')">⚙️ Settings</button>
      </div></div>
      <section id="users" class="section"><div class="top"><button onclick="showSec('home')">← Back</button><h2>Users</h2></div><div class="box"><b id="utotal">Total users: …</b><input id="usearch" placeholder="Search name, @username or ID" oninput="shown=50;renderUsers()" style="margin-top:10px"><div id="ulist">Loading…</div></div></section>
      <section id="withdrawals" class="section"><div class="top"><button onclick="showSec('home')">← Back</button><h2>Pending Withdrawals</h2></div><div class="box">${W.length?W.map(([id,w],i)=>`<div class="item"><b>৳${w.amount} · ${e(w.method)}</b><br>${e(w.account_number)}<br>${e(w.first_name)} @${e(w.username)} (${e(w.telegram_id)})<br>Balance after request: <span class="${B[i]<0?'bad':''}">৳${B[i].toFixed(2)}</span>${B[i]<0?' <span class="bad">SUSPICIOUS</span>':''}<br><button onclick="act('${id}','approved')">Approve</button><button class="danger" onclick="act('${id}','rejected')">Reject</button></div>`).join(''):'<p>None</p>'}</div></section>
      <section id="tasks" class="section"><div class="top"><button onclick="showSec('home')">← Back</button><h2>Tasks</h2></div><div class="box">${T.length?T.map(([id,t])=>`<div class="item"><b>${e(t.title)}</b> · ৳${t.reward} · ${t.active?'active':'off'} <button onclick="tog('${id}')">Toggle</button></div>`).join(''):'<p>No tasks</p>'}</div><div class="box"><h3>Add Task</h3><label>Title</label><input id="t1"><label>Description</label><input id="t2"><label>Link (https)</label><input id="t3"><label>Reward</label><input id="t4" type="number"><button onclick="addT()">Add task</button></div></section>
      <section id="settings" class="section"><div class="top"><button onclick="showSec('home')">← Back</button><h2>Settings</h2></div><div class="box">${K.map(k=>`<label>${k}</label>`+(k.endsWith('body')?`<textarea id="s_${k}" rows="6">${e(S[k])}</textarea>`:`<input id="s_${k}" value="${e(S[k])}">`)).join('')}<button onclick="save()">Save settings</button></div></section>`;
    showSec(cur);
  }catch(x){m.innerHTML="<h2>Admin error</h2><div class='box'>"+e(x.message)+"</div>";}
}
function showSec(id){cur=id;if(id==="users")loadUsers();document.querySelectorAll('.section').forEach(x=>x.style.display='none');document.getElementById('home').style.display=id==='home'?'block':'none';if(id!=='home')document.getElementById(id).style.display='block';window.scrollTo(0,0);}

const av=u=>{const ch=e(Array.from(u.name||u.un||"?")[0].toUpperCase());const fb=`<div style="width:46px;height:46px;border-radius:50%;background:#4a5cff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none">${ch}</div>`;
  return u.photo?`<img src="${e(u.photo)}" referrerpolicy="no-referrer" style="width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none" data-fb="${e(fb)}" onerror="this.outerHTML=this.dataset.fb">`:fb};
async function loadUsers(){
  const ul=document.getElementById("ulist");ul.textContent="Loading…";
  try{
    const [U0,Wd0,St0]=await Promise.all([G("users"),G("userWd"),G("wdStatus")]);
    const U=U0||{},Wd=Wd0||{},St=St0||{};
    USERS=Object.entries(U).map(([id,u])=>{let bal=Object.values(u.ledger||{}).reduce((a,x)=>a+N(x.amount),0);
      const W=Wd[id]||{};for(const k of Object.keys(W))if(St[k]&&St[k].pub==="rejected")bal+=N(W[k].amount);
      const p=u.profile||{};
      return{id,name:p.first_name||"",un:p.username||"",photo:p.photo_url||"",bal:Math.round(bal*100)/100}});
    USERS.sort((a,b)=>b.bal-a.bal);shown=50;renderUsers();
  }catch(x){ul.textContent="Error: "+x.message}
}
function renderUsers(){
  const q=(document.getElementById("usearch").value||"").toLowerCase().trim();
  const L=USERS.filter(u=>!q||(u.name+" "+u.un+" "+u.id).toLowerCase().includes(q));
  document.getElementById("utotal").textContent="Total users: "+USERS.length+(q?" · Showing "+L.length:"");
  document.getElementById("ulist").innerHTML=L.slice(0,shown).map(u=>`<div class="item"><div style="display:flex;gap:12px;align-items:center">${av(u)}<div style="flex:1;min-width:0"><b>${e(u.name)||"No name"}</b><br><span style="color:#667391;font-size:12px">${u.un?"@"+e(u.un)+" · ":""}ID ${e(u.id)}</span></div><div style="text-align:right"><div style="font-size:12px;color:#667391">Balance</div><b id="b_${e(u.id)}" class="${u.bal<0?"bad":""}">৳${u.bal.toFixed(2)}</b></div></div><div style="display:flex;gap:6px;margin-top:10px;align-items:center"><input id="a_${e(u.id)}" type="number" step="0.01" min="0" placeholder="Amount" style="margin:0"><button style="margin:0" onclick="adj('${e(u.id)}',1)">＋ Add</button><button class="danger" style="margin:0" onclick="adj('${e(u.id)}',-1)">－ Cut</button></div></div>`).join("")+(L.length>shown?`<button onclick="shown+=50;renderUsers()">Show more</button>`:"")||"<p>No users</p>";
}
async function adj(id,sg){
  const inp=document.getElementById("a_"+id),v=Math.abs(N(inp.value)),u=USERS.find(x=>x.id===id);
  if(!v)return alert("Enter an amount");
  const note=prompt((sg>0?"Add ":"Deduct ")+"৳"+v+(sg>0?" to ":" from ")+(u.name||id)+"?\nOptional note:","");
  if(note===null)return;
  try{
    const t=Date.now();
    await R("users/"+id+"/ledger/admin_"+t+"_"+Math.floor(Math.random()*1000)).set({type:"admin_adjust",amount:sg*v,description:note||"Admin adjustment",t});
    u.bal=Math.round((u.bal+sg*v)*100)/100;inp.value="";
    const b=document.getElementById("b_"+id);b.textContent="৳"+u.bal.toFixed(2);b.className=u.bal<0?"bad":"";
  }catch(x){alert(x.message)}
}
const run=async fn=>{try{await fn();await load()}catch(x){alert(x.message)}};
const act=(id,st)=>run(()=>R("wdStatus/"+id).set({pub:st}));
const putTasks=async f=>{const T=await G("tasks/pub")||{};f(T);await R("tasks").set({pub:T})};
const tog=id=>run(()=>putTasks(T=>{T[id].active=!T[id].active}));
const addT=()=>run(()=>{if(!t1.value||!/^https:\/\//.test(t3.value))throw new Error("Title and https link required");return putTasks(T=>{T["t"+Date.now()]={title:t1.value,description:t2.value,url:t3.value,reward:N(t4.value),type:"Task",verify:"visit",active:true}})});
const save=()=>run(async()=>{const o={};K.forEach(k=>{const v=document.getElementById("s_"+k).value;o[k]=TXT.includes(k)?v:N(v)});await R("settings").set({pub:o});alert("Saved")});
load();
</script></body></html>
