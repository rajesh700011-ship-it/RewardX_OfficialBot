function showPopup(){const p=S.cfg.popup;if(!p||!p.enabled||!((p.title||"").trim()||(p.body||"").trim()))return;const o=document.createElement("div");o.className="pop";
o.innerHTML=`<div class="pc"><button class="px" aria-label="Close">${I("x")}</button><h3></h3><p></p><button class="btn w"></button></div>`;
o.querySelector("h3").textContent=p.title;o.querySelector("p").textContent=p.body;const b=o.querySelector(".btn");b.textContent=p.btn||"বুঝেছি";
const close=()=>{o.classList.remove("in");setTimeout(()=>o.remove(),200)};
b.onclick=()=>{if(/^https:\/\//.test(p.link||"")){tg&&tg.openLink?tg.openLink(p.link):window.open(p.link,"_blank")}close()};
o.querySelector(".px").onclick=close;o.onclick=e=>{if(e.target===o)close()};document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add("in"))}
async function render(){const a=$("#app");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(!S){a.innerHTML=skel();try{S=await api.me()}catch(e){console.error(e);a.innerHTML=errCard("Unable to load balance",e);return}}
  a.innerHTML=`<div class="pg">${views[tab]()}</div>`;if(!window._p){window._p=1;showPopup()}
  if(tab==="home")count($("#bal"),S.balance);
  document.querySelectorAll(".bar i").forEach(b=>setTimeout(()=>b.style.width=b.dataset.w+"%",60));
  if(tab==="tasks")try{const t=await api.tasks();T=t;$("#tl").innerHTML=t.map(x=>`<div class="card"><div class="row sp"><b>${esc(x.title)}</b><span class="rw">${money(x.reward)}</span></div><div class="mu sm" style="margin:6px 0 12px">${esc(x.desc)}</div><div class="row sp"><span class="tag">${esc(x.type)} · ${esc(x.verify)}</span><button class="btn g" data-task="${x.id}">${opened.has(x.id)?"Claim reward":"Start task"}</button></div></div>`).join("")}catch(e){$("#tl").innerHTML=errCard("Unable to load tasks")}
  if(tab==="wd")try{const h=await api.withdrawals(),k={Pending:"p",Approved:"a",Rejected:"r"};$("#wh").innerHTML=h.map(x=>`<div class="card"><div class="row sp"><b>${money(x.amount)} · ${x.method}</b><span class="tag ${k[x.status]}">${x.status}</span></div><div class="sm mu" style="margin-top:6px">${x.date}${x.ref?" · Ref "+x.ref:""}</div></div>`).join("")}catch(e){$("#wh").innerHTML=errCard("Something went wrong")}
}
let method=null;
document.addEventListener("click",async e=>{const t=e.target.closest("[data-t],[data-go],[data-ad],[data-m],[data-req],[data-copy],[data-share],[data-task],[data-daily],[data-welcome],[data-n]");if(!t)return;const d=t.dataset;
  if(d.t||d.go){tab=d.t||d.go;method=null;scrollTo(0,0);return render()}
  if("m"in d){method=d.m;document.querySelectorAll(".pm button").forEach(b=>b.classList.toggle("on",b===t));return}
  if("n"in d)return toast("No new notifications",true);
  if("daily"in d){t.disabled=true;try{await api.claimDaily()}catch(x){toast(x.message,false)}t.disabled=false;return}
  if("copy"in d){try{await navigator.clipboard.writeText(S.link);toast("Referral link copied",true)}catch(x){toast("Copy unavailable on this device",false)}return}
  if("share"in d){const u="https://t.me/share/url?url="+encodeURIComponent(S.link)+"&text="+encodeURIComponent("RewardX-এ জয়েন করুন এবং এড দেখে ইনকাম করুন!");tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank");return}
  const go=async(fn)=>{t.disabled=true;try{await fn()}catch(x){toast(x.message,false)}t.disabled=false};
  if("welcome"in d)return go(()=>api.claimWelcome());
  if("ad"in d)return go(async()=>{const r=await api.requestAd();if(r&&r.balance!=null){S.balance=r.balance;S.cfg.adDone=r.adDone;S.today=r.today;toast("রিওয়ার্ড জমা হয়েছে",true);render()}});
  if("task"in d){const x=T.find(v=>v.id==d.task);if(!x)return;
    if(!opened.has(x.id)){if(/^https:\/\//.test(x.url||"")){tg&&tg.openLink?tg.openLink(x.url):window.open(x.url,"_blank")}opened.add(x.id);t.textContent="Claim reward";return}
    return go(()=>api.claimTask(x.id))}
  if("req"in d){const c=S.cfg,n=$("#acc").value.trim(),a=parseFloat($("#amt").value);
    if(!method)return toast("Select a payment method",false);
    if(!/^01[3-9]\d{8}$/.test(n))return toast("Enter a valid 11-digit account number",false);
    if(!(a>=c.minWd))return toast("Minimum withdrawal not reached",false);
    if(a>S.balance)return toast("Insufficient balance",false);
    if(S.refs<c.needRefs)return toast("Referral requirement not met",false);
    return go(()=>api.withdraw({method,account:n,amount:a}))}
});
render();
</script></body></html>
